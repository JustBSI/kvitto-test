[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kvitto-test"
version = "0.1.0"
description = "A small payment API for an online school"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.142.2",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
